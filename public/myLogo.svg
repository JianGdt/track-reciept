<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lobster&amp;display=swap');
      .t { font-family: 'Lobster', 'Pacifico', 'Brush Script MT', 'Segoe Script', cursive; font-size: 112px; }
    </style>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="#2a3a63"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask"><rect width="780" height="280" fill="url(#fade)"/></mask>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9bdf2"/>
      <stop offset="1" stop-color="#5470a8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <g id="art">
      <!-- receipt with zigzag bottom -->
      <path d="M78 66 H168 V186 L156 176 L144 186 L132 176 L120 186 L108 176 L96 186 L78 176 Z" stroke-linejoin="round"/>
      <!-- lock badge -->
      <circle cx="170" cy="186" r="28"/>
      <!-- text + swoosh -->
      <text class="t" x="490" y="146" text-anchor="middle" textLength="440" lengthAdjust="spacingAndGlyphs">Resivault</text>
      <path d="M290 178 Q470 154 650 162 Q490 192 308 202 Q278 204 290 178 Z"/>
    </g>
  </defs>


  <g transform="rotate(-5 390 140)">
    <use href="#art" fill="none" stroke="#6f8fd6" stroke-width="34" stroke-linejoin="round" filter="url(#glow)" opacity="0.8"/>
    <use href="#art" fill="url(#blue)" stroke="url(#blue)" stroke-width="30" stroke-linejoin="round"/>
    <use href="#art" fill="#0a0e18" stroke="#0a0e18" stroke-width="16" stroke-linejoin="round"/>
    <use href="#art" fill="#fff" stroke="none"/>

    <!-- receipt text lines -->
    <g stroke="#0a0e18" stroke-width="7" stroke-linecap="round">
      <line x1="94" y1="92" x2="130" y2="92"/>
      <line x1="94" y1="114" x2="152" y2="114"/>
      <line x1="94" y1="136" x2="124" y2="136"/>
    </g>

    <!-- lock badge on top -->
    <circle cx="170" cy="186" r="28" fill="url(#blue)" stroke="#0a0e18" stroke-width="8"/>
    <path d="M161 184 v-7 a9 9 0 0 1 18 0 v7" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <rect x="155" y="183" width="30" height="22" rx="5" fill="#fff"/>
    <circle cx="170" cy="193" r="3.5" fill="#0a0e18"/>
  </g>
</svg>
